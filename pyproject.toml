[project]
name = "khatib-lab-support"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]


# Runtime only. The scaffold's Google Cloud extras (gcp, otel-gcp,
# bigquery-analytics, gcsfs, google-cloud-logging) are gone: this project has
# no GCP project, and they pushed the install past Vercel's 500 MB function
# limit (608 MB with them, about 240 MB without).
dependencies = [
    "google-adk>=2.8.0,<2.9.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "weaviate-client>=4.10,<5",
    "httpx>=0.27",
    # LLM_PROVIDER=openrouter, through ADK's LiteLlm adapter. A main dependency
    # so every installer (Docker, Vercel, requirements.txt) gets it. Pinned
    # exactly: 1.82.7/1.82.8 were malware. 1.96.2 is the newest release the
    # eval extra allows (google-cloud-aiplatform[evaluation] requires
    # >=1.83.7,<1.97) and is above the fix versions of the advisories checked
    # on 2026-11-02, most of which concern the LiteLLM proxy server, not the
    # SDK used here. Re-check https://github.com/advisories?query=litellm
    # before bumping, and again whenever the eval cap is lifted.
    "litellm==1.96.2",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.8.0,<2.9.0",
    # 2.6+ is the first that accepts a patched LiteLLM (it caps it below 1.97).
    "google-cloud-aiplatform[evaluation]>=2.6.0,<3.0.0"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.vercel]
# The FastAPI app is not in one of Vercel's auto-detected entrypoint files.
entrypoint = "app.fast_api_app:app"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = [
    "E501",  # line too long
    "C901",  # too complex
    "B006",
    # This is an Arabic-language project. RUF001/002/003 flag Arabic
    # punctuation (؟ ، ؛) as "ambiguous unicode", which fires on essentially
    # every prompt, message and test string here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


