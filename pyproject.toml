[project]
name = "khatib-lab-support"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]


dependencies = [
    "google-adk[gcp,otel-gcp,bigquery-analytics]>=2.8.0,<2.9.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "gcsfs>=2024.11.0",
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "weaviate-client>=4.10,<5",
    "httpx>=0.27",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
# LLM_PROVIDER=openrouter. Pinned exactly: every LiteLLM release before 1.97
# falls inside a published advisory range, and 1.82.7/1.82.8 were malware.
# Re-check https://github.com/advisories?query=litellm before bumping.
openrouter = [
    "litellm==1.104.1",
]
eval = [
    "google-adk[eval]>=2.8.0,<2.9.0",
    "google-cloud-aiplatform[evaluation]>=1.156.0,<2.0.0"
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.uv]
# google-cloud-aiplatform[evaluation] caps litellm below 1.86, which the
# openrouter extra deliberately excludes. The eval tooling runs only on a
# developer machine; production installs `--extra openrouter`, never `eval`.
conflicts = [
    [{ extra = "openrouter" }, { extra = "eval" }],
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = [
    "E501",  # line too long
    "C901",  # too complex
    "B006",
    # This is an Arabic-language project. RUF001/002/003 flag Arabic
    # punctuation (؟ ، ؛) as "ambiguous unicode", which fires on essentially
    # every prompt, message and test string here.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "session"

[tool.hatch.build.targets.wheel]
packages = ["app","frontend"]


